# Pretrain on FineWeb-Edu — ~110M params, real web text, ~40h on RTX 4080.
#
# The next step up from pretrain_tinystories (29M, children's stories): a
# bigger model on a much higher-signal corpus. Tinystories' SFT chat felt
# weak because the base model never saw real-world facts or general
# English; FineWeb-Edu fixes that.
#
# Position in the ladder:
#   pretrain_tinystories (23M, ~935M tokens)
#     -> pretrain_fineweb.yaml (this, 110M, ~4.4B tokens trained on a ~4.6B-token corpus)
#
# Sizing (RTX 4080 16GB):
#   ~110M params (12L, 12H, d_model=768, d_ff=2048)
#   vocab 32K — proper coverage for general English, not the 8K
#     tinystories vocab that fragments rare words
#   seq_len 1024 — captures longer contexts than tinystories' 512
#   batch 8, grad_accum 4 -> effective 32; ~9-10GB VRAM in bf16
#     (batch=16 OOMed at ~13.8GB on a 16GB 4080 once step-0 eval had
#     fragmented the allocator; halving the per-step batch nearly
#     halves activation memory while keeping the effective batch.)
#   134K steps × 32 × 1024 = 4.38B tokens trained — ~40 tokens/param, i.e.
#     2x Chinchilla-optimal (~2.2B for 110M). Overtraining past Chinchilla
#     is standard for a small model you'll actually run for inference: the
#     extra compute keeps lowering loss well past the Chinchilla point.
#     Single epoch over a ~7M-doc corpus (~4.6B tokens) with no repetition;
#     the lossplot callback writes loss_curve.png (train vs val) so you can
#     confirm it's still learning and not overfitting. For plain
#     Chinchilla-optimal (~20 tokens/param) instead, drop to ~67K steps.
#
# One-time data prep (~6-7h download + ~25min tokenizer + ~1h pack):
#   python scripts/data/download_corpus.py --source fineweb_edu \
#       --output data/fineweb/corpus.jsonl --subset sample-10BT --max-docs 7000000
#   python scripts/data/train_tokenizer.py --corpus data/fineweb/corpus.jsonl \
#       --jsonl-key text --output data/fineweb/tokenizer.json --vocab-size 32000
#   python scripts/data/prepare_data.py --corpus data/fineweb/corpus.jsonl \
#       --jsonl-key text --tokenizer data/fineweb/tokenizer.json \
#       --output data/fineweb/ --val-frac 0.005
#
# Then launch:
#   python scripts/train/train.py --config configs/pretrain_fineweb.yaml

run_name: pretrain_fineweb
output_dir: runs
seed: 42
device: auto

model:
  type: transformer
  vocab_size: 32000
  max_seq_len: 1024
  n_layers: 12
  n_heads: 12
  d_model: 768
  d_ff: 2048
  dropout: 0.0
  tie_embeddings: true
  norm_type: rmsnorm

tokenizer:
  type: bpe
  path: data/fineweb/tokenizer.json

data:
  type: pretrain
  train_path: data/fineweb/train.bin
  val_path: data/fineweb/val.bin
  seq_len: 1024
  num_workers: 4

optim:
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 1000
  lr_schedule: cosine
  min_lr_ratio: 0.1

trainer:
  max_steps: 134000            # ~40 tokens/param (2x Chinchilla); single epoch over ~7M-doc corpus
  batch_size: 8
  grad_accum_steps: 4          # effective batch 32 — stabler grads at this scale
  grad_clip: 1.0
  precision: bf16
  compile: false               # flip on once stable for ~10-20% speedup

callbacks:
  - type: logfile
  - type: console
    params:
      every: 50
  - type: jsonl
  - type: tensorboard
  - type: checkpoint
    params:
      every: 2000
      keep_last_k: 2
  - type: eval
    params:
      every: 1000
  - type: sample
    params:
      every: 2000
      prompts:
        - "Once upon a time"
        - "The sun rose over"
        - "Scientists recently discovered that"
      max_new_tokens: 96
      # Top-p with mild penalties instead of greedy: greedy on a small
      # undertrained base model collapses into repetition loops and hides
      # how the chat REPL will actually behave. These settings match the
      # chat task defaults so mid-training samples preview real generation.
      strategy: top_p
      top_p: 0.9
      temperature: 0.8
      frequency_penalty: 0.3
      presence_penalty: 0.3

  - type: benchmark              # end-of-training, write benchmark_pretrain.txt next to checkpoints
    params:
      phase: pretrain

  - type: lossplot             # end-of-training, write loss_curve.png (train vs val) next to checkpoints
