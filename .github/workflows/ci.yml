name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install (CPU-only torch + dev/eval extras)
        run: |
          python -m pip install --upgrade pip
          # PyPI wheels are CPU-only, which is exactly what CI wants.
          pip install -e ".[dev,eval]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
