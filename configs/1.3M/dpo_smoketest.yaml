# DPO smoketest — 1.3M shakespeare-tokenizer model, synthetic multiple-choice
# data. Verifies the dpo stage end-to-end: frozen reference + N-way log-ratio
# cross-entropy. Bootstrap from a pretrain/SFT run with --from-pretrained.
#
#   python scripts/data/make_mc_smoketest_data.py
#   python scripts/train/train.py --config configs/1.3M/dpo_smoketest.yaml \
#       --from-pretrained auto --pretrain-run-name sft_smoketest

run_name: dpo_smoketest
output_dir: runs
seed: 42
device: auto
stage: dpo

model:
  type: transformer
  vocab_size: 2048
  max_seq_len: 256
  n_layers: 4
  n_heads: 4
  d_model: 128
  d_ff: 384
  dropout: 0.0
  tie_embeddings: true
  norm_type: rmsnorm

tokenizer:
  type: bpe
  path: data/shakespeare/tokenizer.json

data:
  type: mc
  train_path: data/mc_smoketest/train.jsonl
  val_path: data/mc_smoketest/val.jsonl
  seq_len: 128
  num_workers: 0

dpo:
  beta: 0.1
  score_norm: none        # match raw-acc tasks; use "char" for acc_norm tasks

optim:
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 5
  lr_schedule: constant
  min_lr_ratio: 1.0

trainer:
  max_steps: 60
  batch_size: 8
  grad_accum_steps: 1
  grad_clip: 1.0
  precision: fp32
  compile: false

callbacks:
  - type: logfile
  - type: console
    params:
      every: 5
  - type: jsonl
  - type: checkpoint
    params:
      every: 60
      keep_last_k: 1
