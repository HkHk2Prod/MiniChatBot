# DAPT for the ARC branch — "domain knowledge" stage: continued next-token
# prediction on SciQ science prose, forking from the base pretrain checkpoint.
# Raises the prior on correct ARC-style continuations before the dpo_arc stage
# sharpens the gold-vs-distractor margin. Same machinery as pretrain; reuses
# the base model's tokenizer (no retraining).
#
#   python scripts/data/download_corpus.py --source science --output data/science/corpus.jsonl
#   python scripts/data/prepare_data.py --corpus data/science/corpus.jsonl --jsonl-key text \
#       --tokenizer data/fineweb/tokenizer.json --output data/science/ --val-frac 0.02
#   python scripts/train/train.py --config configs/100M/dapt_arc.yaml \
#       --from-pretrained auto --pretrain-run-name pretrain_fineweb
#
# Then dpo_arc forks from THIS run:
#   python scripts/train/train.py --config configs/100M/dpo_arc.yaml \
#       --from-pretrained auto --pretrain-run-name dapt_arc

run_name: dapt_arc
output_dir: runs
seed: 42
device: auto
stage: dapt

model:
  type: transformer
  vocab_size: 32000
  max_seq_len: 1024
  n_layers: 12
  n_heads: 12
  d_model: 768
  d_ff: 2048            # match pretrain_fineweb checkpoint
  dropout: 0.0
  tie_embeddings: true
  norm_type: rmsnorm

tokenizer:
  type: bpe
  path: data/fineweb/tokenizer.json

data:
  type: pretrain
  train_path: data/science/train.bin
  val_path: data/science/val.bin
  seq_len: 1024
  num_workers: 4

optim:
  lr: 5.0e-5              # gentle continued-pretraining LR (well below base pretrain)
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 50
  lr_schedule: cosine
  min_lr_ratio: 0.1

trainer:
  max_steps: 2000
  batch_size: 16          # fits a 16GB 4080 now that grad_checkpointing frees block activations
  grad_accum_steps: 1     # effective batch 16, unchanged
  grad_clip: 1.0
  precision: bf16
  compile: false
  grad_checkpointing: true   # recompute block activations in backward: large memory cut, ~20-30% slower

callbacks:
  - type: logfile
  - type: console
    params:
      every: 50
  - type: jsonl
  - type: eval
    params:
      every: 250
  - type: checkpoint
    params:
      every: 500
      keep_last_k: 2
  - type: lm_eval
    params:
      target_tasks: [arc_easy]
      other_tasks: [piqa, arc_challenge, hellaswag, lambada_openai, wikitext]
      num_fewshot: 0
      # limit: 500
