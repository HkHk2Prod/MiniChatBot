# GRPO RL on top of the 29M tinystories SFT model, using the synthetic
# GSM8K-shaped smoketest data. The tinystories/alpaca model is domain-
# mismatched to real math (and the 8K-vocab tinystories BPE tokenizes math
# poorly), so this exercises the RL loop at 29M scale rather than producing
# a solver. Real GSM8K RL lives at 100M (configs/100M/rl_gsm8k.yaml).
#
# The model: block mirrors sft_tinystories.yaml so the SFT checkpoint loads.
#
# Prereqs:
#   1. An sft_tinystories run with a ckpt_best.pt.
#   2. The tinystories tokenizer (has chat tokens).
#   3. The synthetic RL data:
#        python scripts/data/make_rl_smoketest_data.py
#
# Then launch:
#   python scripts/train/rl.py --config configs/29M/rl_tinystories.yaml \
#       --from-pretrained auto --pretrain-run-name sft_tinystories

run_name: rl_tinystories
output_dir: runs
seed: 42
device: auto

model:
  type: transformer
  vocab_size: 8000             # match sft_tinystories / pretrain_tinystories
  max_seq_len: 512
  n_layers: 6
  n_heads: 8
  d_model: 512
  d_ff: 1408
  dropout: 0.0
  tie_embeddings: true
  norm_type: rmsnorm

tokenizer:
  type: bpe
  path: data/tinystories/tokenizer.json

data:
  type: rl
  train_path: data/rl_smoketest/train.jsonl
  seq_len: 256
  num_workers: 0
  system_prompt: "Solve it and end with: #### <number>"

rl:
  group_size: 8
  max_new_tokens: 64
  temperature: 1.0             # must be > 0 — greedy collapses every group member to one string
  top_p: 1.0
  top_k: null
  normalize_advantage_std: true
  reward: gsm8k

optim:
  lr: 1.0e-5                   # small — RL on a learned policy
  weight_decay: 0.0
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 10
  lr_schedule: constant
  min_lr_ratio: 1.0

trainer:
  max_steps: 200
  batch_size: 4                # 4 prompts x group 8 = 32 seqs/backward — fine at 29M
  grad_accum_steps: 1
  grad_clip: 1.0
  precision: bf16
  compile: false

callbacks:
  - type: logfile
  - type: console
    params:
      every: 5
  - type: jsonl
  - type: sample
    params:
      every: 50
      chat_template: true
      stop_on_eos: true
      prompts:
        - "Tom has 7 apples and buys 5 more. How many apples does he have now?"
      max_new_tokens: 64
  - type: checkpoint
    params:
      every: 100
      keep_last_k: 2

  - type: benchmark
    params:
      phase: rl
      # ctx 512 with ~150-token GSM8K benchmark prompts under the 8K-vocab
      # tinystories BPE leaves room; 128 generation stays within budget.
      max_new_tokens: 128
